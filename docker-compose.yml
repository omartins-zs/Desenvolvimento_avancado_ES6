services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: es6_avancado_app
    restart: unless-stopped
    environment:
      APP_NAME: "Desenvolvimento Avançado ES6"
      APP_ENV: docker
      APP_URL: http://localhost:8080
      PORT: 3000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: es6_avancado
      DB_USERNAME: es6_user
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - es6_network

  nginx:
    image: nginx:1.27-alpine
    container_name: es6_avancado_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - es6_network

  mysql:
    image: mysql:8.0
    container_name: es6_avancado_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: es6_avancado
      MYSQL_USER: es6_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - es6_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: es6_avancado_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - es6_network

networks:
  es6_network:
    driver: bridge

volumes:
  mysql_data:
